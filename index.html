<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đuổi Hình Bắt Chữ</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">
        <h1>ĐUỔI HÌNH BẮT CHỮ</h1>

        <div class="images">
            <img src="src/hama.png" alt="Ảnh 1">
            <img src="src/banoi.png" alt="Ảnh 2">
        </div>

        <h2>Điền đáp án</h2>

        <!-- Khu vực hiển thị các ô chữ -->
        <div id="answerBoxes"></div>

        <!-- Input thật được ẩn đi nhưng dùng để hứng bộ gõ tiếng Việt -->
        <input id="hiddenInput" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

        <button id="checkBtn">Kiểm Tra</button>

        <p id="result"></p>
    </div>

    <script src="script.js"></script>
</body>

</html>
