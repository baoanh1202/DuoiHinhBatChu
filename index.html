<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đuổi Hình Bắt Chữ</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">
        <h1>ĐUỔI HÌNH BẮT CHỮ</h1>

        <div class="images">
            <!-- Ảnh câu hỏi và ảnh nền mở màn -->
            <img id="gameImage" src="src/batdau.png" alt="Hình ảnh câu hỏi">
        </div>

        <h2 id="questionTitle">SẴN SÀNG CHƯA?</h2>

        <!-- Khu vực hiển thị các ô chữ -->
        <div id="answerBoxes"></div>

        <!-- Input ẩn dùng để nhận dữ liệu từ bàn phím -->
        <input id="hiddenInput" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

        <div class="actions">
            <!-- Hệ thống nút điều khiển -->
            <button id="startBtn">Bắt Đầu Trò Chơi ➔</button>
            <button id="checkBtn" style="display: none;">Kiểm Tra</button>
            <button id="nextBtn" style="display: none;">Câu Tiếp Theo ➔</button>
        </div>

        <p id="result"></p>
    </div>

    <script src="script.js"></script>
</body>

</html>
