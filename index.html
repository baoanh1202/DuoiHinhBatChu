<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đuổi Hình Bắt Chữ</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">
        <h1>ĐUỔI HÌNH BẮT CHỮ</h1>

        <div class="images">
            <!-- Chỉ dùng 1 ảnh duy nhất, thay đổi linh hoạt bằng JS -->
            <img id="gameImage" src="" alt="Hình ảnh câu hỏi">
        </div>

        <h2 id="questionTitle">Câu hỏi số 1</h2>

        <!-- Khu vực hiển thị các ô chữ -->
        <div id="answerBoxes"></div>

        <!-- Input thật được ẩn đi nhưng dùng để hứng bộ gõ tiếng Việt -->
        <input id="hiddenInput" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">

        <div class="actions">
            <button id="checkBtn">Kiểm Tra</button>
            <button id="nextBtn" style="display: none;">Câu Tiếp Theo ➔</button>
        </div>

        <p id="result"></p>
    </div>

    <script src="script.js"></script>
</body>

</html>
